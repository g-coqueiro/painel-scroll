<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Scroll</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <iframe id="frame" title="Dashboard de eficiência energética"></iframe>

    <!-- Slides: fica invisível enquanto não houver slide para exibir. -->
    <div id="slideshow" aria-hidden="true">
        <iframe id="slide" title="Slide"></iframe>
    </div>

    <!-- Selo de diagnóstico: aparece por alguns segundos na primeira carga. -->
    <div id="badge" hidden></div>

    <script src="app.js"></script>

</body>

</html>
